<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#08080a">
    <title>Opening Havyn confirmation</title>
    <script>
      (() => {
        const destination = new URL("https://havyn-web.pages.dev/verify/");
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        window.location.replace(destination.toString());
      })();
    </script>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #f7f7f9;
        background: #08080a;
        font-family: Manrope, Inter, ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }
      a { color: #ff6570; }
    </style>
  </head>
  <body>
    <p>Opening Havyn confirmation. <a href="https://havyn-web.pages.dev/verify/">Continue</a></p>
  </body>
</html>
