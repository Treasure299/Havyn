<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#08080a">
    <meta name="description" content="Complete your Havyn email confirmation.">
    <link rel="icon" href="/havyn-mark-192.png" type="image/png" sizes="192x192">
    <link rel="icon" href="/havyn-mark.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/havyn-mark-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Confirm your email | Havyn</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #ffffff;
        --soft: #f3f4f5;
        --ink: #0a0a0b;
        --muted: #5d6067;
        --line: #e5e6e8;
        --red: #f13b46;
        --green: #16784b;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: Manrope, Arial, sans-serif;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(1180px, calc(100% - 48px));
        min-height: 84px;
        margin: 0 auto;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: var(--ink);
        font-size: 21px;
        font-weight: 800;
        text-decoration: none;
      }

      .brand img { width: 30px; height: 30px; }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 22px;
      }

      .product-label {
        color: #777a81;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .verify-page {
        display: grid;
        grid-template-columns: minmax(0, 0.92fr) minmax(360px, 0.78fr);
        width: min(1180px, calc(100% - 48px));
        min-height: calc(100vh - 84px);
        margin: 0 auto;
      }

      .confirmation {
        display: grid;
        align-content: center;
        border-right: 1px solid var(--line);
        padding: 72px clamp(48px, 7vw, 94px) 72px 16px;
      }

      .eyebrow {
        margin: 0 0 22px;
        color: var(--red);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .confirmation h1 {
        max-width: 620px;
        margin: 0;
        font-size: clamp(46px, 6vw, 76px);
        font-weight: 700;
        line-height: 0.98;
        letter-spacing: 0;
      }

      .message {
        max-width: 550px;
        margin: 28px 0 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.7;
      }

      .actions {
        display: grid;
        justify-items: start;
        gap: 22px;
        margin-top: 36px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        border: 1px solid var(--red);
        border-radius: 0;
        padding: 0 24px;
        color: #fff;
        background: var(--red);
        font-size: 13px;
        font-weight: 800;
        text-decoration: none;
      }

      .button:hover { background: #dd2d38; border-color: #dd2d38; }

      .close-note {
        margin: 0;
        color: #85878d;
        font-size: 11px;
        line-height: 1.6;
      }

      .visual {
        display: grid;
        place-items: center;
        padding: 64px;
        background: var(--soft);
      }

      .visual-inner {
        display: grid;
        justify-items: center;
        width: min(100%, 310px);
      }

      .status {
        display: grid;
        place-items: center;
        width: 112px;
        height: 112px;
        border: 2px solid var(--ink);
        color: var(--ink);
        background: var(--paper);
        font-size: 43px;
        font-weight: 800;
      }

      .status-rule {
        width: 100%;
        height: 4px;
        margin-top: -2px;
        background: var(--red);
      }

      .visual-label {
        width: 100%;
        margin: 25px 0 0;
        color: var(--ink);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0;
        text-align: center;
        text-transform: uppercase;
      }

      .verify-page.is-success .status { color: var(--green); }
      .verify-page.is-error .status { color: var(--red); }
      .verify-page.is-neutral .status { color: #74777d; }

      @media (max-width: 760px) {
        .topbar { width: calc(100% - 36px); min-height: 70px; }
        .product-label { display: none; }
        .button.nav-button { min-height: 38px; padding: 0 14px; font-size: 11px; }
        .verify-page {
          grid-template-columns: 1fr;
          width: 100%;
          min-height: calc(100vh - 70px);
        }
        .confirmation {
          order: 2;
          align-content: start;
          border-right: 0;
          padding: 42px 24px 54px;
        }
        .confirmation h1 { font-size: 46px; line-height: 1; }
        .message { margin-top: 22px; font-size: 15px; line-height: 1.65; }
        .actions { margin-top: 28px; }
        .visual { order: 1; min-height: 190px; padding: 34px 24px; }
        .status { width: 82px; height: 82px; font-size: 32px; }
        .visual-label { margin-top: 18px; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="https://havyn-beta.vercel.app/" aria-label="Havyn home"><img src="/havyn-mark.svg" alt=""><span>havyn</span></a>
      <div class="topbar-actions">
        <span class="product-label">Web beta</span>
        <a class="button nav-button" href="/">Open Havyn Web</a>
      </div>
    </header>
    <main id="confirmation" class="verify-page is-neutral" aria-live="polite">
      <section class="confirmation">
        <p id="state-label" class="eyebrow">Email confirmation</p>
        <h1 id="title">Checking your link.</h1>
        <p id="message" class="message">Havyn is reading the confirmation result from your email.</p>
        <div class="actions">
          <a class="button" href="/">Open Havyn Web</a>
          <p id="close-note" class="close-note">You can close this tab after opening Havyn.</p>
        </div>
      </section>
      <section class="visual" aria-hidden="true">
        <div class="visual-inner">
          <div id="status" class="status">&middot;</div>
          <div class="status-rule"></div>
          <p class="visual-label">Your people. One screen.</p>
        </div>
      </section>
    </main>
    <script>
      (() => {
        const query = new URLSearchParams(window.location.search);
        const hash = new URLSearchParams(window.location.hash.slice(1));
        const read = (key) => query.get(key) || hash.get(key) || "";
        const error = read("error") || read("error_code");
        const description = read("error_description").replace(/\+/g, " ");
        const type = read("type");
        const confirmed = Boolean(read("access_token") || read("code") || ["signup", "email_change"].includes(type));
        const panel = document.getElementById("confirmation");
        const status = document.getElementById("status");
        const label = document.getElementById("state-label");
        const title = document.getElementById("title");
        const message = document.getElementById("message");
        const closeNote = document.getElementById("close-note");

        if (error) {
          panel.className = "verify-page is-error";
          status.textContent = "!";
          label.textContent = "Confirmation incomplete";
          title.textContent = "This link is no longer valid.";
          message.textContent = description || "The link may have expired or already been used. Open Havyn and request a fresh confirmation email.";
          closeNote.textContent = "Sign in again to request a new email if your account is not yet confirmed.";
        } else if (confirmed) {
          panel.className = "verify-page is-success";
          status.innerHTML = "&#10003;";
          label.textContent = "Email confirmed";
          title.textContent = "You are ready to watch.";
          message.textContent = "Your Havyn account is active. Open Havyn Web or return to the Havyn app and sign in.";
        } else {
          panel.className = "verify-page is-neutral";
          status.textContent = "?";
          label.textContent = "Confirmation link required";
          title.textContent = "Open the link from your email.";
          message.textContent = "This page does not contain a confirmation result. Return to the latest email from Havyn and use its confirmation button.";
          closeNote.textContent = "If the email has expired, sign in to Havyn to request another one.";
        }

        if (window.location.search || window.location.hash) {
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      })();
    </script>
  </body>
</html>
